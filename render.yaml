services:
  # WiFi Billing API Service
  - type: web
    name: fastnet-api
    runtime: node
    buildCommand: npm install && npm run build && npx prisma generate --schema=./prisma/schema.prisma
    # The repository's historical migrations were created for SQLite.  `db push`
    # provisions the PostgreSQL schema declared in prisma/schema.prisma on first
    # deploy without attempting to run those incompatible files.
    startCommand: npx prisma db push --schema=./prisma/schema.prisma && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: fastnet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: MPESA_ENABLED
        value: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MIKROTIK_ENABLED
        value: false
      - key: MIKROTIK_HOST
        sync: false
      - key: MIKROTIK_USER
        sync: false
      - key: MIKROTIK_PASSWORD
        sync: false
      - key: MIKROTIK_PORT
        value: 8728
      - key: LOAN_WIFI_DURATION_HOURS
        value: 1

databases:
  # PostgreSQL Database
  - name: fastnet-db
    plan: free
    databaseName: wifi_billing
    user: wifi_user
