services:
  # WiFi Billing API Service
  - type: web
    name: fastnet-api
    runtime: node
    buildCommand: npm install && npx prisma generate --schema=./prisma/schema.prisma
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: fastnet-db
          property: connectionString
      - key: JWT_SECRET
        value: change_this_to_a_secure_random_string_here
      - key: ADMIN_USERNAME
        value: mathew_admin
      - key: ADMIN_PASSWORD
        value: change_this_admin_password
      - key: ADMIN_EMAIL
        value: mathewrean@gmail.com
      - key: MPESA_ENABLED
        value: true
      - key: MPESA_CONSUMER_KEY
        value: placeholder_consumer_key
      - key: MPESA_CONSUMER_SECRET
        value: placeholder_consumer_secret
      - key: MPESA_SHORTCODE
        value: 174379
      - key: MPESA_PASSKEY
        value: placeholder_passkey
      - key: MPESA_CALLBACK_URL
        value: https://fastnet-api.onrender.com/api/mpesa/callback
      - key: MIKROTIK_ENABLED
        value: false
      - key: MIKROTIK_HOST
        value: 192.168.88.1
      - key: MIKROTIK_USER
        value: admin
      - key: MIKROTIK_PASSWORD
        value: LHPMXPV9TZ
      - key: MIKROTIK_PORT
        value: 8728
      - key: LOAN_WIFI_DURATION_HOURS
        value: 1

  # WiFi Billing Frontend Service
  - type: web
    name: fastnet-frontend
    runtime: node
    buildCommand: cd frontend && npm install && npx next build --webpack
    startCommand: cd frontend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: fastnet-api
          property: host

databases:
  # PostgreSQL Database
  - name: fastnet-db
    plan: free
    databaseName: wifi_billing
    user: wifi_user